version: "3.9"

services:
  db:
    image: postgres:17
    container_name: postgres-todo
    environment:
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: todo-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:mypassword@db:5432/tododb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: